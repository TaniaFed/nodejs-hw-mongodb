type: object
required:
  - name
  - email
  - password
properties:
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email address"
    type: string
    example: john.doe@mail.com
  password:
    description: "User's password"
    type: string
    example: 'Under2389$'
  role:
    description: "User's role"
    type: string
    enum: ['user']
    example: 'User'
