tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - photo
        properties:
          name:
            description: "Contacts's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contacts's phone number"
            type: string
            example: 1234567890
          email:
            description: "Contacts's email"
            type: string
            example: john.doe@mail.com
          isFavourite:
            description: "Contact's category"
            type: boolean
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to contact's photo"
            type: string
            example: https://res.cloudinary.com/dvdsrxjhw/image/upload/v1749263288/contacts/galb98pffnat71xma3wl.jpg
responses:
  '201':
    $ref: ../../components/responses/201.yaml
  '401':
    $ref: ../../components/responses/401.yaml
